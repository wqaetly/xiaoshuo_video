[project]
name = "xiaoshuo-video"
version = "1.0.0"
description = "小说转视频自动化生成框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your@email.com" }]
keywords = ["video", "novel", "ai", "generation"]

dependencies = [
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "httpx>=0.25,<1.0",
    "aiohttp>=3.9,<4.0",
    "pillow>=10.0,<11.0",
    "opencv-python>=4.8,<5.0",
    "moviepy>=1.0.3,<2.0",
    "ffmpeg-python>=0.2.0,<1.0",
    "openai>=1.0,<2.0",
    "edge-tts>=6.1.0,<7.0",
    "tqdm>=4.66,<5.0",
    "rich>=13.0,<14.0",
    "loguru>=0.7,<1.0",
    "python-dotenv>=1.0,<2.0",
    "asyncio-throttle>=1.0,<2.0",
    # Web API 后端
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "websockets>=14.0,<15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-asyncio>=0.21,<1.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.1,<1.0",
    "pre-commit>=3.6,<4.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]
gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
xiaoshuo-video = "src.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Ruff 配置 (替代 flake8 + isort + black)
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "ComfyUI",
    "CosyVoice",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip without strict
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# MyPy 配置
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "ComfyUI/",
    "CosyVoice/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = ["moviepy.*", "cv2.*"]
ignore_missing_imports = true

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# Coverage 配置
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
