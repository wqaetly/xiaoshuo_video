# 全局设置
app:
  name: "小说转视频"
  version: "1.0.0"
  debug: true

# 默认视频参数
video:
  resolution: "1280x720"
  fps: 24
  style: "realistic_gufeng"  # anime / realistic / illustration / realistic_gufeng

  # 视频生成方式
  # provider: "local" - 使用本地 Wan 2.1 模型 (推荐 16GB 显存)
  # provider: "api" - 使用远端 API (jimeng/kling)
  provider: "local"  # local / api

  # 本地视频生成配置 (provider: "local" 时使用)
  local:
    workflow: "wan2_i2v.json"
    model: "wan2.1_i2v_480p_bf16.safetensors"  # 可用 GGUF 量化版本
    video_length: 81          # 默认帧数 (~5秒 @ 16fps)
    fps: 16                   # 输出帧率
    width: 832                # 视频宽度
    height: 480               # 视频高度
    steps: 30                 # 采样步数
    cfg: 5.0                  # CFG Scale

# 本地服务配置
local:
  ollama_url: "http://localhost:11434"
  ollama_model: "glm4:9b"  # GLM-4-9B: 优秀的中文理解能力，适合小说分镜解析
  comfyui_url: "http://localhost:8188"
  cosyvoice_url: "http://localhost:9880"

# 图像生成配置 (Z-Image-Turbo)
image:
  model: "z_image_turbo"  # z_image_turbo / sdxl
  workflow: "z_image_turbo_scene.json"
  # Z-Image-Turbo 参数 (4步快速生成，无需负向提示词)
  steps: 4
  cfg: 1
  sampler: "res_multistep"
  scheduler: "simple"

  # 角色一致性方案 (二选一)
  # 方案1: Z-Image-i2L (推荐) - 从参考图即时生成 LoRA，更精准
  # 方案2: IP-Adapter - 传统图像特征注入，速度更快
  character_consistency:
    method: "i2l"  # i2l / ipadapter / none

  # Z-Image-i2L 配置 (method: "i2l" 时使用)
  i2l:
    enabled: true
    workflow: "z_image_i2l.json"
    lora_strength: 1.0            # LoRA 强度 (0.0-2.0), 值越大角色越一致
    apply_to_unet: true           # 是否应用到 UNET

  # IP-Adapter 配置 (method: "ipadapter" 时使用, 作为备选方案)
  ipadapter:
    enabled: false                                    # 是否启用 (i2l 启用时建议关闭)
    workflow: "z_image_turbo_ipadapter.json"          # IP-Adapter 工作流
    model: "ip-adapter-plus_sdxl_vit-h.safetensors"   # IP-Adapter 模型
    clip_vision: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"  # CLIP Vision 模型
    weight: 0.8           # IP-Adapter 权重 (0.0-1.0)
    noise: 0.0            # 噪声级别
    weight_type: "standard"
    start_at: 0.0
    end_at: 1.0

# API配置
api:
  video_provider: "jimeng"  # jimeng / kling
  use_idle_time: true  # 使用闲时折扣

# 生成参数
generation:
  scene_duration_min: 3.0
  scene_duration_max: 6.0
  max_concurrent_tasks: 3
  retry_count: 3
  retry_delay: 5
  # 并行执行模式：图像和音频可以同时生成（它们没有依赖关系）
  enable_parallel: true

# 音频处理配置
audio:
  # 音频反应效果 (Yvann-Nodes / SaltAI)
  audio_reactive:
    enabled: false               # 是否启用音频反应效果
    sensitivity: 0.7             # 反应灵敏度 (0.0-1.0)
    frequency_bands: 4           # 频段数量

  # 口型同步 (LatentSync) - 实验性功能
  lip_sync:
    enabled: false               # 是否启用口型同步
    model: "latentsync"          # 模型选择

# 路径配置
paths:
  projects_dir: "data/projects"
  models_dir: "models"
  temp_dir: "temp"

# 日志配置
logging:
  enabled: true               # 是否启用文件日志
  log_dir: "log"              # 日志目录
  level: "DEBUG"              # 日志级别: DEBUG / INFO / WARNING / ERROR
  rotation: "50 MB"           # 日志文件轮转大小
  retention: "30 days"        # 日志保留时间
  # 按模块分类日志文件
  separate_modules: true      # 是否按模块分别记录日志
  # 模块日志文件名
  modules:
    api: "api.log"            # WebUI API 后端日志
    llm: "llm.log"            # LLM/Ollama 调用日志
    comfyui: "comfyui.log"    # ComfyUI 图像生成日志
    tts: "tts.log"            # TTS 语音合成日志
    video: "video.log"        # 视频生成日志
    pipeline: "pipeline.log"  # 流程控制日志
    all: "app.log"            # 全局日志 (所有模块)
