# 全局设置
app:
  name: "小说转视频"
  version: "1.0.0"
  debug: true

# 默认视频参数
video:
  resolution: "1280x720"
  fps: 24
  style: "realistic_gufeng"  # anime / realistic / illustration / realistic_gufeng

# 本地服务配置
local:
  ollama_url: "http://localhost:11434"
  ollama_model: "qwen2.5:14b"
  comfyui_url: "http://localhost:8188"
  cosyvoice_url: "http://localhost:9880"

# 图像生成配置 (Z-Image-Turbo)
image:
  model: "z_image_turbo"  # z_image_turbo / sdxl
  workflow: "z_image_turbo_scene.json"
  # Z-Image-Turbo 参数 (4步快速生成，无需负向提示词)
  steps: 4
  cfg: 1
  sampler: "res_multistep"
  scheduler: "simple"

  # IP-Adapter 角色一致性配置
  ipadapter:
    enabled: true                                     # 是否启用角色一致性
    workflow: "z_image_turbo_ipadapter.json"          # IP-Adapter 工作流
    model: "ip-adapter-plus_sdxl_vit-h.safetensors"   # IP-Adapter 模型
    clip_vision: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"  # CLIP Vision 模型
    weight: 0.8           # IP-Adapter 权重 (0.0-1.0), 值越大角色越一致但可能丢失场景细节
    noise: 0.0            # 噪声级别
    weight_type: "standard"  # 权重类型: standard / linear / ease in / ease out
    start_at: 0.0         # 开始应用的采样步骤比例
    end_at: 1.0           # 停止应用的采样步骤比例

# API配置
api:
  video_provider: "jimeng"  # jimeng / kling
  use_idle_time: true  # 使用闲时折扣

# 生成参数
generation:
  scene_duration_min: 3.0
  scene_duration_max: 6.0
  max_concurrent_tasks: 3
  retry_count: 3
  retry_delay: 5

# 路径配置
paths:
  projects_dir: "data/projects"
  models_dir: "models"
  temp_dir: "temp"
